name: Security Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit:
    name: Run All Security Checks & Save Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Initialize Report File
        run: |
          echo "==========================================" > security-report.txt
          echo "       FULL SECURITY AUDIT REPORT         " >> security-report.txt
          echo "       Generated: $(date)                " >> security-report.txt
          echo "==========================================" >> security-report.txt
          echo "" >> security-report.txt

      - name: Run Semgrep SAST Scan
        run: |
          echo "------------------------------------------" >> security-report.txt
          echo "1. SEMGREP SAST CODE FINDINGS" >> security-report.txt
          echo "------------------------------------------" >> security-report.txt
          semgrep scan --config p/security-audit --config p/owasp-top-ten --config p/php --config p/javascript >> security-report.txt 2>&1 || true
          echo "" >> security-report.txt

      - name: Run TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Run PHP & JS Dependency Audits
        run: |
          echo "------------------------------------------" >> security-report.txt
          echo "2. COMPOSER (PHP) DEPENDENCY VULNERABILITIES" >> security-report.txt
          echo "------------------------------------------" >> security-report.txt
          composer audit --locked >> security-report.txt 2>&1 || true
          echo "" >> security-report.txt

          echo "------------------------------------------" >> security-report.txt
          echo "3. NPM (JS) DEPENDENCY VULNERABILITIES" >> security-report.txt
          echo "------------------------------------------" >> security-report.txt
          npm audit --audit-level=high >> security-report.txt 2>&1 || true

      - name: Upload Security Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-security-report
          path: security-report.txt
